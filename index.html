<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="images/tr334ct__logo--favicon.svg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="script.js"></script>
    <title>r334ct</title>
  </head>
  <body>
    <!-- HEADER -->

    <header>
      <div class="header__left">
        <div class="title">
          <figure class="title__img--wrapper">
            <img
              src="images/tr334ct-logo.svg"
              alt="treeact logo"
              class="title__img"
            />
          </figure>
          <h1 class="title__text">r334ct</h1>
        </div>
      </div>

      <div class="header__right">
        <nav class="topnav">
          <ul class="nav__links">
            <li class="nav__link"><a href="">About</a></li>
            <li class="nav__link"><a href="">Blog</a></li>
            <li class="nav__link"><a href="">Pricing</a></li>
            <li class="nav__link"><a href="">Contact</a></li>
          </ul>
        </nav>

        <div class="account">
          <a href="#" class="account__login">Login</a>
          <button class="btn--primary">Sign Up</button>
        </div>

        <div class="hamburger__icon">
          <figure class="icon__wrapper">
            <img
              src="./images/bars.svg"
              alt=""
              class="icon__image"
              aria-label="Toggle navigation"
            />
          </figure>
        </div>
      </div>

      <div class="hamburger">
        <nav class="hamburger__menu">
          <div class="hamburger__icon--close">
            <figure class="icon__wrapper">
              <img src="./images/cross.svg" alt="" class="icon__image" />
            </figure>
          </div>
          <ul class="nav__links hamburger__links">
            <li class="nav__link hamburger__link"><a href="#">About</a></li>
            <li class="nav__link hamburger__link"><a href="#">Blog</a></li>
            <li class="nav__link hamburger__link"><a href="#">Pricing</a></li>
            <li class="nav__link hamburger__link"><a href="#">Contact</a></li>
            <li class="nav__link hamburger__link"><a href="#">Login</a></li>
          </ul>
          <button class="btn--primary hamburger__button">Sign Up</button>
        </nav>
      </div>
    </header>

    <!-- MAIN -->
    <main>
      <section id="hero">
        <div class="row">
          <div class="col col--left col--forty">
            <hgroup class="hero__text">
              <h1 class="hero__title">
                Beautiful React Templates <span class="green">for you.</span>
              </h1>
              <p class="hero__description">
                Our templates are easy to setup, understand and customize. Fully
                modular elements with a variety of pages and components.
              </p>
            </hgroup>
            <div class="email">
              <input
                type="email"
                name=""
                id=""
                class="email__input"
                placeholder="Your E-mail Address"
              />
              <button class="btn--primary email__button">Get Started</button>
            </div>
            <div class="customers">
              <p class="customers__text">Our trusted customers</p>
              <figure class="customers__image--wrapper">
                <img
                  src="./images/customers.png"
                  alt="list of companies"
                  class="customers__image"
                />
              </figure>
            </div>
          </div>
          <div class="col col--right col--sixty">
            <figure class="hero__image--wrapper">
              <img src="./images/hero-image.svg" alt="woman working at the computer" class="hero__image">
            </figure>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
